name: hemtt

on:
  push:
    branches:
      - main
      - devbuild
  pull_request:
  workflow_dispatch:

# Only the latest build of a PR matters, and the devbuild branch is
# machine-generated and force-pushed on every label change - cancel superseded
# runs of both. Builds of main are never cancelled.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/devbuild' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout the source code
      uses: actions/checkout@v4
    - name: Setup HEMTT
      uses: arma-actions/hemtt@v1
    - name: Run HEMTT build
      run: hemtt build
    - name: Rename build folder
      run: mv .hemttout/build .hemttout/@hct
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: hct-${{ github.sha }}-nobin
        path: .hemttout/@*
        include-hidden-files: true # Because .hemttout is a hidden directory
        if-no-files-found: error
